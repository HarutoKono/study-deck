*{box-sizing:border-box}html{scroll-behavior:smooth}body{background:var(--bg);margin:0;color:var(--ink);min-height:100vh}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.44}button:focus-visible,a:focus-visible{outline:3px solid #91afff;outline-offset:2px}#app{max-width:1040px;margin:0 auto;padding:20px 24px 85px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 28px}.brand{display:flex;align-items:center;gap:12px;cursor:pointer;border:0;background:none;text-align:left;padding:0}.logo{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:var(--blue);color:white;font-size:17px;font-weight:850;letter-spacing:-1px;box-shadow:0 8px 18px rgba(65,105,225,.22)}.brandname{font-size:18px;font-weight:850;letter-spacing:-.5px}.tagline{font-size:11px;color:var(--sub);margin-top:1px}.top-actions{display:flex;gap:8px;align-items:center}.pill{display:inline-flex;gap:6px;align-items:center;background:#eef3fa;border-radius:100px;padding:7px 11px;font-size:12px;font-weight:650;color:#50607a}.iconbtn{height:38px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:white;color:#495e80;font-size:13px}.breadcrumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:20px;font-size:13px}.crumb{border:0;background:none;color:var(--sub);padding:4px 0}.crumb.current{font-weight:800;color:var(--ink)}.sep{color:#9ba9bf}.eyebrow{font-size:11px;font-weight:850;letter-spacing:2px;color:var(--blue);text-transform:uppercase;margin:0 0 10px}h1{font-size:clamp(27px,4vw,38px);line-height:1.33;letter-spacing:-.9px;margin:0 0 11px}h2{font-size:18px;letter-spacing:-.4px}.lead{color:var(--sub);line-height:1.85;font-size:14px;margin:0}.hero{padding:28px;border:1px solid #e1e9fb;background:linear-gradient(125deg,#ffffff,#f2f6ff);border-radius:24px;box-shadow:var(--shadow);margin-bottom:24px}.hero-inner{display:flex;justify-content:space-between;align-items:center;gap:20px}.hero-number{font-weight:850;font-size:45px;letter-spacing:-2px;line-height:1}.hero-number-label{font-size:12px;color:var(--sub);margin-top:7px}.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border-radius:13px;padding:13px 18px;border:1px solid transparent;font-size:14px;font-weight:800;transition:transform .12s,background .12s}.btn:active{transform:scale(.987)}.btn.primary{color:white;background:var(--blue)}.btn.primary:hover{background:#3157cb}.btn.secondary{background:#fff;border-color:#d7e0f0;color:#344b70}.btn.ghost{color:var(--sub);background:transparent;border:none}.btn:disabled{opacity:.42}.btn.wide{width:100%}.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 0 13px}.section-title h2{margin:0}.section-sub{color:var(--sub);font-size:12px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:var(--shadow);text-align:left;min-height:151px;display:flex;flex-direction:column;align-items:flex-start;position:relative;color:inherit}.tile.active:hover,.folder-row:hover{border-color:#b4c8ff;box-shadow:0 12px 22px rgba(65,105,225,.08)}.tile.disabled{opacity:.63;cursor:default}.tile-icon{display:grid;place-items:center;background:#edf2ff;border-radius:12px;font-size:24px;width:45px;height:45px;margin-bottom:17px}.tile-title{font-weight:800;font-size:17px}.tile-meta{color:var(--sub);font-size:12px;margin-top:5px}.tile-chevron{position:absolute;right:16px;top:19px;color:#9caac4}.folder-list{display:flex;flex-direction:column;gap:10px}.folder-row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;text-align:left;color:inherit;box-shadow:var(--shadow);width:100%}.folder-left{display:flex;align-items:center;gap:14px}.folder-emoji{background:#eef2fd;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px}.folder-name{font-size:15px;font-weight:800}.folder-path{font-size:11px;color:var(--sub);margin-top:6px}.folder-right{display:flex;align-items:center;gap:11px;color:#7a8aa3;font-size:12px}.tiny-progress{margin-top:15px;height:7px;background:#e7edfb;border-radius:30px;overflow:hidden;display:flex}.tiny-progress>span{height:100%}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--sub)}.stats b{color:var(--ink)}.panel{background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:23px;margin:16px 0}.panel h2{margin:0 0 12px}.options{display:grid;gap:9px}.option{display:flex;gap:12px;align-items:center;text-align:left;background:#fbfcff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;color:inherit;width:100%}.option.selected{border-color:#6486eb;background:#eef3ff}.dot{width:20px;height:20px;border:2px solid #b7c4da;border-radius:50%;flex:0 0 20px;display:grid;place-items:center}.option.selected .dot{border-color:var(--blue)}.option.selected .dot:after{content:'';width:10px;height:10px;border-radius:50%;background:var(--blue)}.option-title{font-weight:800;font-size:14px}.option-help{font-size:12px;color:var(--sub);margin-top:4px}.selection-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.subtle{color:var(--sub);font-size:13px;line-height:1.8}.notice{padding:15px 17px;background:#fff9ec;border:1px solid #f5e3af;color:#85651f;border-radius:13px;font-size:13px;line-height:1.7}.resume{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#edf7f3;border:1px solid #c7e8dd;border-radius:16px;padding:18px;margin-bottom:17px}.resume strong{font-size:14px}.resume small{display:block;color:#557e71;margin-top:6px;line-height:1.6}.resume-actions{display:flex;gap:8px;flex-wrap:wrap}.quiz-shell{max-width:710px;margin:0 auto}.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.quiz-count{font-size:12px;color:var(--sub);font-weight:750}.progress-track{margin:14px 0 20px;height:8px;background:#e3ebf9;border-radius:100px;overflow:hidden}.progress-fill{height:100%;background:var(--blue);border-radius:100px;transition:width .16s}.question-card{background:#fff;border:1px solid var(--line);border-radius:25px;padding:34px 30px 25px;box-shadow:0 18px 36px rgba(24,55,102,.07)}.q-kicker{font-size:11px;letter-spacing:2px;color:var(--blue);font-weight:850}.question{font-size:clamp(21px,4vw,27px);font-weight:850;line-height:1.85;letter-spacing:-.3px;white-space:pre-wrap;min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;margin:13px 0 19px}.answer-box{background:#f1f5fc;border-radius:18px;padding:21px;margin-top:16px;border:1px solid #e1e9f5}.answer-head{font-size:11px;color:var(--green);font-weight:900;letter-spacing:1.7px}.answer-text{font-size:16px;white-space:pre-wrap;line-height:2.05;font-weight:750;margin:8px 0 0;overflow-wrap:anywhere}.explain{background:#fff;border:1px solid #e1e8f0;border-radius:13px;padding:16px;font-size:13px;line-height:1.9;color:#394e69;margin-top:12px}.review-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.judge{border-radius:14px;padding:16px 7px;border:1px solid;font-size:14px;font-weight:850}.judge.bad{color:#ba4953;border-color:#ffced2;background:var(--redBg)}.judge.good{color:#087b5b;border-color:#b7e8d7;background:var(--greenBg)}.quiz-bottom{display:flex;justify-content:space-between;gap:10px;margin-top:15px}.end-card{text-align:center;padding:34px 22px}.end-emoji{font-size:49px;margin-bottom:12px}.end-card h1{margin-bottom:8px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.result-cell{background:#f4f7fd;border-radius:15px;padding:17px 7px}.result-cell strong{display:block;font-size:29px;letter-spacing:-1px}.result-cell span{display:block;font-size:11px;color:var(--sub);margin-top:5px}.end-actions{display:grid;gap:9px;margin-top:18px}.empty{border:1px dashed #cfd9e8;background:#fff;border-radius:20px;padding:38px 22px;text-align:center}.bottom-info{font-size:12px;color:#93a0b3;text-align:center;padding-top:40px;line-height:1.9}.settings-item{margin:10px 0;padding:12px 0;border-bottom:1px solid var(--line)}.settings-item:last-child{border-bottom:none}.small{font-size:12px;color:var(--sub);line-height:1.65}.hidden{display:none!important}.mode-line{margin:13px 0 0;color:var(--sub);font-size:12px}.meta-list{display:flex;flex-wrap:wrap;gap:6px}.meta-chip{border-radius:100px;background:#eef3ff;padding:6px 10px;font-size:11px;color:#4565ad;font-weight:800}#fileInput{display:none}

<script id="study-data" type="application/json">{"schema":1,"version":"1.0.0","title":"Study Deck","nodes":[{"id":"japanese","title":"国語","parent":null,"emoji":"📖"},{"id":"kobun","title":"古文","parent":"japanese","emoji":"📜"},{"id":"jodoushi","title":"助動詞","parent":"kobun","emoji":"✏️"},{"id":"ru-raru","title":"る・らる","parent":"jodoushi"},{"id":"su-sasu-shimu","title":"す・さす・しむ","parent":"jodoushi"},{"id":"zu","title":"ず","parent":"jodoushi"},{"id":"ji-mu-muzu","title":"じ・む・むず","parent":"jodoushi"},{"id":"mashi-mahoshi","title":"まし・まほし","parent":"jodoushi"},{"id":"ki-keri","title":"き・けり","parent":"jodoushi"},{"id":"tsu-nu","title":"つ・ぬ","parent":"jodoushi"},{"id":"tari-ri","title":"たり・り","parent":"jodoushi"},{"id":"kemu-ramu","title":"けむ・らむ","parent":"jodoushi"},{"id":"tashi-rashi","title":"たし・らし","parent":"jodoushi"},{"id":"beshi-maji","title":"べし・まじ","parent":"jodoushi"},{"id":"nari-meri","title":"なり・めり（伝聞・推定）","parent":"jodoushi"},{"id":"nari-tari-gotoshi","title":"なり・たり・ごとし（断定など）","parent":"jodoushi"},{"id":"general","title":"助動詞の識別・総合","parent":"jodoushi"}],"subjectsComingSoon":["英語","数学","日本史","物理","化学","その他"],"questions":[{"id":"kobun-jodo-001","topic":"ru-raru","question":"助動詞「る・らる」は何形に接続するか？","answer":"未然形","explanation":"どちらも未然形に付く。"},{"id":"kobun-jodo-002","topic":"ru-raru","question":"「る・らる」は、それぞれどの活用の動詞に接続するか？","answer":"る：四段・ナ変・ラ変（四ナラ）\nらる：上一・上二・下一・下二・カ変・サ変（上下カサ）","explanation":"「四ナラ＝る、それ以外＝らる」と覚える。"},{"id":"kobun-jodo-003","topic":"ru-raru","question":"「る・らる」の活用の型と、未然・連用・終止・連体・已然・命令の6形を答えよ。","answer":"どちらも下二段型\nる：れ・れ・る・るる・るれ・れよ\nらる：られ・られ・らる・らるる・らるれ・られよ","explanation":"6形は常に未然→連用→終止→連体→已然→命令の順。"},{"id":"kobun-jodo-004","topic":"ru-raru","question":"「る・らる」の4つの意味と、それぞれの訳し方を答えよ。","answer":"①受身：〜れる・〜られる\n②可能：〜できる\n③自発：自然と〜れる・〜られる\n④尊敬：お〜になる・〜なさる","explanation":"覚え方：受可自尊（じゅかじそん）。"},{"id":"kobun-jodo-005","topic":"ru-raru","question":"「る・らる」を受身と判断する目安は？","answer":"上に「〜（誰々）に」がある、または補える場合。","explanation":"「誰に何をされたか」という受身の関係を確認する。"},{"id":"kobun-jodo-006","topic":"ru-raru","question":"「る・らる」を可能と判断する目安は？","answer":"下に打消の語がある場合。","explanation":"「〜できない」と訳せるかを確認。あくまで識別の目安。"},{"id":"kobun-jodo-007","topic":"ru-raru","question":"「る・らる」を自発と判断する目安は？","answer":"上に心情・知覚を表す動詞がある場合。","explanation":"「思ふ・見る」など。自分の意志とは関係なく自然と生じる気持ち。"},{"id":"kobun-jodo-008","topic":"ru-raru","question":"「る・らる」を尊敬と判断する目安は？","answer":"主語が敬意を払うべき人物である場合。","explanation":"「〜なさる」と訳せるか、主語と文脈を見る。"},{"id":"kobun-jodo-009","topic":"ru-raru","question":"「仰せらる」の「らる」は何の意味か？","answer":"尊敬（〜なさる）","explanation":"教材の識別ポイント。"},{"id":"kobun-jodo-010","topic":"ru-raru","question":"「れ給ふ・られ給ふ」の「れ・られ」は、基本的にどの意味を考えるか？","answer":"尊敬以外（受身・可能・自発）","explanation":"「給ふ」自体が尊敬を表す場合の識別の目安。文脈を優先する。"},{"id":"kobun-jodo-011","topic":"su-sasu-shimu","question":"「す・さす・しむ」は何形に接続するか？","answer":"未然形","explanation":""},{"id":"kobun-jodo-012","topic":"su-sasu-shimu","question":"「す・さす・しむ」は、それぞれどの活用の動詞に接続するか？","answer":"す：四段・ナ変・ラ変（四ナラ）\nさす：上一・上二・下一・下二・カ変・サ変（上下カサ）\nしむ：すべての活用","explanation":"いずれも未然形接続。"},{"id":"kobun-jodo-013","topic":"su-sasu-shimu","question":"「す・さす・しむ」の活用の型と6形を答えよ。","answer":"すべて下二段型\nす：せ・せ・す・する・すれ・せよ\nさす：させ・させ・さす・さする・さすれ・させよ\nしむ：しめ・しめ・しむ・しむる・しむれ・しめよ","explanation":""},{"id":"kobun-jodo-014","topic":"su-sasu-shimu","question":"「す・さす・しむ」の意味と、それぞれの訳し方を答えよ。","answer":"①使役：〜させる\n②尊敬：お〜になる・〜なさる","explanation":""},{"id":"kobun-jodo-015","topic":"su-sasu-shimu","question":"「す・さす・しむ」の直後に尊敬語がない場合、基本的に何の意味になるか？","answer":"使役（〜させる）","explanation":"例外もあるので、「誰かにさせる」関係を文脈で確かめる。"},{"id":"kobun-jodo-016","topic":"su-sasu-shimu","question":"「す・さす・しむ」の直後に尊敬語がある場合、まず何の意味を考えるか？","answer":"尊敬（お〜になる・〜なさる）","explanation":"敬語があれば尊敬を第一候補にするが、使役の可能性もある。"},{"id":"kobun-jodo-017","topic":"su-sasu-shimu","question":"直後に尊敬語があっても、「す・さす・しむ」が使役になる目安は？","answer":"上に「〜に」など、使役の対象が示される・補える場合。","explanation":"「誰かに何かをさせる」という関係があれば使役も考える。"},{"id":"kobun-jodo-018","topic":"zu","question":"打消の助動詞「ず」は何形に接続するか？","answer":"未然形","explanation":""},{"id":"kobun-jodo-019","topic":"zu","question":"「ず」の活用の型と6形を、基本系列・ザリ系列ともに答えよ。","answer":"特殊型\n基本系列：ず・ず・ず・ぬ・ね・○\nザリ系列：ざら・ざり・○・ざる・ざれ・ざれ","explanation":"それぞれ未然→連用→終止→連体→已然→命令の順。"},{"id":"kobun-jodo-020","topic":"zu","question":"「ず」の意味と訳し方を答えよ。","answer":"打消（〜ない）","explanation":""},{"id":"kobun-jodo-021","topic":"zu","question":"「ず」のザリ系列は、主にどのような場合に使うか？","answer":"下にさらに助動詞が続く場合。","explanation":"例：「知らざりけり」。"},{"id":"kobun-jodo-022","topic":"ji-mu-muzu","question":"「じ・む・むず」は何形に接続するか？","answer":"未然形","explanation":""},{"id":"kobun-jodo-023","topic":"ji-mu-muzu","question":"「じ・む・むず」の活用の型と6形を答えよ。","answer":"じ：無変化型 → じ・じ・じ・じ・じ・じ\nむ：四段型 → ま・○・む・む・め・○\nむず：サ変型 → むぜ・むじ・むず・むずる・むずれ・むぜよ","explanation":"教科書の表に合わせて整理。"},{"id":"kobun-jodo-024","topic":"ji-mu-muzu","question":"「じ」の2つの意味と訳し方を答えよ。","answer":"①打消推量：〜ないだろう\n②打消意志：〜するつもりはない・〜まい","explanation":""},{"id":"kobun-jodo-025","topic":"ji-mu-muzu","question":"「む・むず」の6つの意味と訳し方を答えよ。","answer":"①推量：〜だろう\n②意志：〜しよう\n③勧誘：〜しませんか\n④適当：〜するのがよい\n⑤仮定：〜ならば\n⑥婉曲：〜ような","explanation":"覚え方：推意勧適仮婉。"},{"id":"kobun-jodo-026","topic":"ji-mu-muzu","question":"「む・むず」の主語が一・二・三人称の場合、それぞれ何の意味になりやすいか？","answer":"一人称：意志（〜しよう）\n二人称：勧誘・適当（〜しませんか・〜するのがよい）\n三人称：推量（〜だろう）","explanation":"主語だけで決めず、文脈も確かめる。"},{"id":"kobun-jodo-027","topic":"ji-mu-muzu","question":"「じ」の主語が一人称・三人称の場合、何の意味になりやすいか？","answer":"一人称：打消意志（〜まい）\n三人称：打消推量（〜ないだろう）","explanation":""},{"id":"kobun-jodo-028","topic":"ji-mu-muzu","question":"「む」が体言を修飾する場合、まず何の意味を考えるか？","answer":"婉曲（〜ような）","explanation":"文脈によって仮定などもあり得る。"},{"id":"kobun-jodo-029","topic":"ji-mu-muzu","question":"「む」の直後に助詞・読点がある場合、何の意味を考えるか？","answer":"婉曲・仮定（〜ような・〜ならば）","explanation":"両方を候補にして文脈で決める。"},{"id":"kobun-jodo-030","topic":"ji-mu-muzu","question":"「む」が仮定になりやすい代表的な4つの形は？","answer":"むに・むには・むも・むこそ","explanation":"「もし〜ならば」の意味を考える。"},{"id":"kobun-jodo-031","topic":"mashi-mahoshi","question":"「まし・まほし」は何形に接続するか？","answer":"未然形","explanation":""},{"id":"kobun-jodo-032","topic":"mashi-mahoshi","question":"「まし・まほし」の活用の型と6形を答えよ。","answer":"まし：特殊型 → ましか／ませ・○・まし・まし・ましか／ませ・○\nまほし：シク活用型 → まほしく／まほしから・まほしく／まほしかり・まほし・まほしき／ ろう・どうして〜ているのだろう）","explanation":""},{"id":"kobun-jodo-061","topic":"tashi-rashi","question":"「たし・らし」は、それぞれ何形に接続するか？","answer":"たし：連用形\nらし：終止形（ラ変型は連体形）","explanation":""},{"id":"kobun-jodo-062","topic":"tashi-rashi","question":"「たし・らし」の活用の型と6形を答えよ。","answer":"たし：ク活用型 → たく／たから・たく／たかり・たし・たき／たかる・たけれ・○／たかれ\nらし：無変化型 → らし・らし・らし・らし・らし・らし","explanation":"基本の語形6つで答えよう。"},{"id":"kobun-jodo-063","topic":"tashi-rashi","question":"「たし・らし」の意味と訳し方を答えよ。","answer":"たし：希望（〜たい）\nらし：推定（〜らしい）","explanation":""},{"id":"kobun-jodo-064","topic":"tashi-rashi","question":"希望を表す「たし・まほし」の接続の違いは？","answer":"たし：連用形\nまほし：未然形","explanation":""},{"id":"kobun-jodo-065","topic":"beshi-maji","question":"「べし・まじ」は何形に接続するか？","answer":"終止形（ラ変型は連体形）","explanation":""},{"id":"kobun-jodo-066","topic":"beshi-maji","question":"「べし・まじ」の活用の型と6形を答えよ。","answer":"べし：ク活用型 → べく／べから・べく／べかり・べし・べき／べかる・べけれ・○／べかれ\nまじ：シク活用型 → まじく／まじから・まじく／まじかり・まじ・まじき／まじかる・まじけれ・○／まじかれ","explanation":""},{"id":"kobun-jodo-067","topic":"beshi-maji","question":"「べし」の6つの意味と訳し方を答えよ。","answer":"①推量：〜だろう\n②意志：〜しよう\n③可能：〜できる\n④当然：〜はずだ・〜べきだ\n⑤命令：〜せよ\n⑥適当：〜するのがよい","explanation":"覚え方：スイカ止めて（推・意・可・当・命・適）。"},{"id":"kobun-jodo-068","topic":"beshi-maji","question":"「まじ」の6つの意味と訳し方を答えよ。","answer":"①打消推量：〜ないだろう\n②打消意志：〜まい\n③不可能：〜できない\n④打消当然：〜はずがない・〜べきでない\n⑤禁止：〜するな\n⑥不適当：〜しないほうがよい","explanation":""},{"id":"kobun-jodo-069","topic":"beshi-maji","question":"「べし・まじ」の主語が一人称のとき、基本的に何の意味を考えるか？","answer":"べし：意志（〜しよう）\nまじ：打消意志（〜まい）","explanation":""},{"id":"kobun-jodo-070","topic":"beshi-maji","question":"「べし・まじ」の主語が三人称のとき、基本的に何の意味を考えるか？","answer":"べし：推量（〜だろう）\nまじ：打消推量（〜ないだろう）","explanation":""},{"id":"kobun-jodo-071","topic":"beshi-maji","question":"「べし・まじ」が可能・不可能となる目安は？","answer":"可能・不可能の文脈で、特に「べし」の下に打消の語がある場合。","explanation":"「べからず」は意味が複数考えられるので、文脈を必ず確認。"},{"id":"kobun-jodo-072","topic":"beshi-maji","question":"「べし・まじ」の適当・不適当とは、どういう意味か？","answer":"べし：適当（〜するのがよい）\nまじ：不適当（〜しないほうがよい）","explanation":"相手への勧め・助言に注目。"},{"id":"kobun-jodo-073","topic":"beshi-maji","question":"「べし」の6つの意味を覚える語呂合わせは？","answer":"スイカ止めて（推・意・可・当・命・適）","explanation":"推量・意志・可能・当然・命令・適当。"},{"id":"kobun-jodo-074","topic":"nari-meri","question":"伝聞・推定の「なり・めり」は何形に接続するか？","answer":"終止形（ラ変型は連体形）","explanation":""},{"id":"kobun-jodo-075","topic":"nari-meri","question":"伝聞・推定の「なり・めり」の活用の型と6形を答えよ。","answer":"ともにラ変型\nなり：なら・なり／に・なり・なる・なれ・なれ\nめり：めら・めり・めり・める・めれ・めれ","explanation":""},{"id":"kobun-jodo-076","topic":"nari-meri","question":"伝聞・推定の「なり」の意味と訳し方を答えよ。","answer":"①伝聞：〜という・〜そうだ\n②推定：〜ようだ","explanation":""},{"id":"kobun-jodo-077","topic":"nari-meri","question":"「めり」の意味と訳し方を答えよ。","answer":"①推定：〜ようだ\n②婉曲：〜ような","explanation":""},{"id":"kobun-jodo-078","topic":"nari-meri","question":"伝聞・推定の「なり」は何による推定が多いか？","answer":"聴覚による情報。","explanation":"音や声など、耳からの情報を根拠にする。"},{"id":"kobun-jodo-079","topic":"nari-meri","question":"「めり」は何による推定が多いか？","answer":"視覚による情報。","explanation":"目に見える様子から判断する。"},{"id":"kobun-jodo-080","topic":"nari-tari-gotoshi","question":"断定・存在の「なり」、断定の「たり」、「ごとし」は何に接続するか？","answer":"なり：体言・連体形\nたり：体言\nごとし：体言＋の・連体形など","explanation":""},{"id":"kobun-jodo-081","topic":"nari-tari-gotoshi","question":"断定・存在の「なり」の活用の型と6形を答えよ。","answer":"ナリ活用型 → なら・なり／に・なり・なる・なれ・なれ","explanation":""},{"id":"kobun-jodo-082","topic":"nari-tari-gotoshi","question":"断定の「たり」の活用の型と6形を答えよ。","answer":"タリ活用型 → たら・たり／と・たり・たる・たれ・たれ","explanation":""},{"id":"kobun-jodo-083","topic":"nari-tari-gotoshi","question":"「ごとし」の活用の型と6形を答えよ。","answer":"ク活用型 → ごとく・ごとく・ごとし・ごとき・ごとけれ・○","explanation":""},{"id":"kobun-jodo-084","topic":"nari-tari-gotoshi","question":"断定・存在の「なり」の意味と訳し方を答えよ。","answer":"①断定：〜である\n②存在：〜にある・〜にいる","explanation":""},{"id":"kobun-jodo-085","topic":"nari-tari-gotoshi","question":"断定の「たり」の意味と訳し方を答えよ。","answer":"断定（〜である）","explanation":""},{"id":"kobun-jodo-086","topic":"nari-tari-gotoshi","question":"「ごとし」の意味と訳し方を答えよ。","answer":"①比況：〜のようだ\n②例示：〜のような","explanation":""},{"id":"kobun-jodo-087","topic":"nari-tari-gotoshi","question":"断定・存在の「なり」が存在の意味になる目安は？","answer":"直前に場所や方角を表す体言がある場合。","explanation":"「〜にある・〜にいる」と訳せるか。"},{"id":"kobun-jodo-088","topic":"nari-tari-gotoshi","question":"断定・存在の「なり」が存在でない場合、基本的に何の意味か？","answer":"断定（〜である）","explanation":""},{"id":"kobun-jodo-089","topic":"general","question":"「ぬ」が打消なのか完了なのか、何を見て識別するか？","answer":"打消「ず」の連体形「ぬ」：未然形接続\n完了「ぬ」の終止形「ぬ」：連用形接続","explanation":"同じ形でも直前の活用形が異なる。"},{"id":"kobun-jodo-090","topic":"general","question":"2種類の「なり」の接続と意味・訳し方を答えよ。","answer":"伝聞・推定の「なり」：終止形接続（ラ変は連体形）。伝聞＝〜という・〜そうだ、推定＝〜ようだ\n断定・存在の「なり」：体言・連体形接続。断定＝〜である、存在＝〜にある・〜にいる","explanation":""},{"id":"kobun-jodo-091","topic":"general","question":"2種類の「たり」の接続と意味・訳し方を答えよ。","answer":"完了・存続の「たり」：連用形接続。完了＝〜た、存続＝〜ている・〜てある\n断定の「たり」：体言接続。断定＝〜である","explanation":""}]}</script>
<script>
(()=>{'use strict';
const DATA=JSON.parse(document.getElementById('study-data').textContent);
const NODES=new Map(DATA.nodes.map(n=>[n.id,n]));
const ALL=DATA.questions;
const KEY='studydeck-progress-v1';
const view=document.getElementById('view');
let state={grades:{},sessions:{}};
let volatile=false;
try{const raw=localStorage.getItem(KEY);if(raw){const obj=JSON.parse(raw);state={grades:obj.grades||{},sessions:obj.sessions||{}};}}catch(err){volatile=true;}
let ui={screen:'tree',scope:null,mode:'all',order:'registered',reveal:false,showExplanation:false};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));volatile=false;}catch(e){volatile=true;}}
function children(id){return DATA.nodes.filter(n=>n.parent===id)}
function pathFor(id){const arr=[];let n=NODES.get(id);while(n){arr.unshift(n);n=NODES.get(n.parent)}return arr;}
function nodeDescendants(id){const ids=new Set([id]);const scan=i=>{for(const n of children(i)){ids.add(n.id);scan(n.id)}};scan(id);return ids}
function poolFor(id){const ids=nodeDescendants(id);return ALL.filter(q=>ids.has(q.topic));}
function counts(id){const pool=poolFor(id);const c={all:pool.length,known:0,weak:0,unanswered:0};pool.forEach(q=>{const v=state.grades[q.id]?.status;if(v==='known')c.known++;else if(v==='weak')c.weak++;else c.unanswered++});return c}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function chosen(id){return NODES.get(id)?.title||''}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
function statsRow(c){return `<div class="stats"><span>✅ 習得 <b>${c.known}</b></span><span>🟠 苦手 <b>${c.weak}</b></span><span>◌ 未回答 <b>${c.unanswered}</b></span></div>`}
function progressBar(c){return `<div class="tiny-progress"><span style="width:${c.all?100*c.known/c.all:0}%;background:var(--green)"></span><span style="width:${c.all?100*c.weak/c.all:0}%;background:#e2a064"></span></div>`}
function breadcrumbs(id){const parts=pathFor(id);return `<nav class="breadcrumbs" aria-label="現在の場所"><button class="crumb" data-tree="home">ホーム</button>${parts.map((n,i)=>`<span class="sep">›</span><button class="crumb ${i===parts.length-1?'current':''}" data-tree="${n.id}">${escapeHTML(n.title)}</button>`).join('')}</nav>`}
function headerArea(id){const n=NODES.get(id),c=counts(id);return `${breadcrumbs(id)}<section class="hero"><p class="eyebrow">YOUR STUDY AREA</p><div class="hero-inner"><div><h1>${n.emoji||'📁'} ${escapeHTML(n.title)}</h1><p class="lead">この範囲をまとめて復習することも、さらに細かく選ぶこともできます。</p><div class="meta-list" style="margin-top:13px"><span class="meta-chip">${c.all}問登録</span><span class="meta-chip">苦手 ${c.weak}問</span></div></div><button class="btn primary" data-start="${id}" ${!c.all?'disabled':''}>▶ この範囲をまとめて出題</button></div>${progressBar(c)}${statsRow(c)}</section>`}
function treeView(id=null){ui.screen='tree';ui.scope=id;const n=id?NODES.get(id):null;if(id&&!n){id=null;ui.scope=null;}
 let html='';if(!id){html=`<section class="hero"><p class="eyebrow">MY LEARNING SPACE</p><h1>今日は、何を覚える？</h1><p class="lead">科目を選び、分野を絞り、答えを思い浮かべる。<br>間違えた問題は、覚えるまで何度でも。</p><div class="meta-list" style="margin-top:20px"><span class="meta-chip">時間制限なし</span><span class="meta-chip">苦手問題を自動保存</span><span class="meta-chip">全範囲をまとめて出題</span></div></section><div class="section-title"><h2>科目を選ぶ</h2><span class="section-sub">${ALL.length}問登録済み</span></div><div class="tiles">`;
 for(const x of children(null)){const c=counts(x.id);html+=`<button class="tile active" data-tree="${x.id}"><span class="tile-chevron">↗</span><span class="tile-icon">${x.emoji||'📚'}</span><span class="tile-title">${escapeHTML(x.title)}</span><span class="tile-meta">${c.all}問 · ${c.known}問習得</span></button>`}
 for(const subj of DATA.subjectsComingSoon){html+=`<div class="tile disabled" aria-label="${escapeHTML(subj)}は準備中"><span class="tile-icon">📚</span><span class="tile-title">${escapeHTML(subj)}</span><span class="tile-meta">これから追加予定</span></div>`}
 html+='</div>';
 }else{html=headerArea(id);const ch=children(id);if(ch.length){html+=`<div class="section-title"><h2>さらに範囲を絞る</h2><span class="section-sub">${ch.length}分野</span></div><div class="folder-list">`;ch.forEach((x,i)=>{const c=counts(x.id);html+=`<button class="folder-row" data-tree="${x.id}"><span class="folder-left"><span class="folder-emoji">${x.emoji||'📁'}</span><span><span class="folder-name">${escapeHTML(x.title)}</span><span class="folder-path" style="display:block">${c.all}問 · 習得 ${c.known} / 苦手 ${c.weak}</span></span></span><span class="folder-right"><span>${c.unanswered}問未回答</span><span class="arrow">›</span></span></button>`});html+='</div>'}else{html+=`<div class="empty"><div style="font-size:30px">📇</div><h2>この範囲の問題がそろってるで</h2><p class="subtle">「この範囲をまとめて出題」から始めよう。</p></div>`}}view.innerHTML=html;scrollTop();}
function setScreen(s){ui.screen=s;scrollTop()}
function pickList(scope,mode){const p=poolFor(scope);return p.filter(q=>mode==='all'||(mode==='weak'&&state.grades[q.id]?.status==='weak')||(mode==='unanswered'&&!state.grades[q.id]?.status));}
function pickCount(scope,mode){return pickList(scope,mode).length}
function menu(scope){ui.scope=scope;ui.mode='all';ui.order='registered';renderStart()}
function renderStart(){setScreen('start');const id=ui.scope,c=counts(id),session=state.sessions[id],alive=session&&!session.completed&&session.cursor<session.queue.length;
 let h=breadcrumbs(id)+`<section class="hero"><p class="eyebrow">QUICK START</p><h1>${escapeHTML(chosen(id))}を学習</h1><p class="lead">全問まとめて、または苦手だけ。好きな出題方法を選べるで。</p>${statsRow(c)}</section>`;
 if(alive){h+=`<div class="resume"><div><strong>⏸ 前回の続きが残っています</strong><small>${session.cursor} / ${session.queue.length}問まで回答済み · ${session.mode==='all'?'全問題':session.mode==='weak'?'苦手問題':'未回答問題'} · ${session.order==='random'?'ランダム':'登録順'}</small></div><div class="resume-actions"><button class="btn primary" data-action="resume">▶ 続きから</button><button class="btn secondary" data-action="restart">最初から</button></div></div>`}
 h+=`<div class="selection-two"><section class="panel"><h2>① 出題する問題</h2><div class="options">${[['all','全問題','登録されたすべての問題'],['weak','苦手問題','最後に「分からなかった」を付けた問題'],['unanswered','未回答問題','まだ一度も回答していない問題']].map(([v,title,help])=>`<button class="option ${ui.mode===v?'selected':''}" data-mode="${v}"><span class="dot"></span><span><span class="option-title">${title} <small>(${pickCount(id,v)}問)</small></span><span class="option-help" style="display:block">${help}</span></span></button>`).join('')}</div></section><section class="panel"><h2>② 出題順</h2><div class="options">${[['registered','登録順','教材の順番で学習する'],['random','ランダム','順番を入れ替えて出題する']].map(([v,title,help])=>`<button class="option ${ui.order===v?'selected':''}" data-order="${v}"><span class="dot"></span><span><span class="option-title">${title}</span><span class="option-help" style="display:block">${help}</span></span></button>`).join('')}</div></section></div>`;
 h+=`<div class="panel"><button class="btn primary wide" data-action="begin" ${!pickCount(id,ui.mode)?'disabled':''}>▶ ${pickCount(id,ui.mode)}問の学習を始める</button><p class="mode-line">開始すると、この範囲の前回の出題位置は新しくなります。これまでの正誤記録は消えません。</p></div>`;
 if(volatile)h+='<div class="notice">このブラウザでは保存できない設定の可能性があります。通常モードで開き直してください。</div>';
 view.innerHTML=h;scrollTop();}
function shuffled(ids){ids=[...ids];for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}return ids}
function beginRound(mode=ui.mode,order=ui.order){const qs=pickList(ui.scope,mode);if(!qs.length){renderStart();return}const ids=qs.map(q=>q.id);state.sessions[ui.scope]={scope:ui.scope,mode,order,queue:order==='random'?shuffled(ids):ids,cursor:0,correct:0,wrong:0,completed:false,startedAt:new Date().toISOString()};persist();ui.reveal=false;ui.showExplanation=false;renderQuiz()}
function resumed(){const s=state.sessions[ui.scope];if(!s||s.completed)return renderStart();ui.reveal=false;ui.showExplanation=false;renderQuiz()}
function current(){return state.sessions[ui.scope]}
function renderQuiz(){const s=current();if(!s){renderStart();return}if(s.completed||s.cursor>=s.queue.length)return renderResults();const question=ALL.find(q=>q.id===s.queue[s.cursor]);if(!question){s.cursor++;persist();return renderQuiz()};setScreen('quiz');const percent=Math.round(s.cursor/s.queue.length*100);
 let h=`<div class="quiz-shell"><div class="quiz-top"><button class="btn ghost" data-action="leave">← 範囲に戻る</button><span class="quiz-count">${s.cursor+1} / ${s.queue.length} 問</span></div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><article class="question-card"><p class="q-kicker">QUESTION ${String(s.cursor+1).padStart(2,'0')}</p><div class="question">${escapeHTML(question.question)}</div>`;
 if(!ui.reveal){h+='<button class="btn primary wide" data-action="reveal">◉ 答えを見る</button>'}else{h+=`<div class="answer-box"><div class="answer-head">ANSWER</div><div class="answer-text">${escapeHTML(question.answer)}</div>${question.explanation?(ui.showExplanation?`<div class="explain"><strong>💡 解説</strong><div style="white-space:pre-wrap;margin-top:5px">${escapeHTML(question.explanation)}</div></div>`:`<button class="btn secondary wide" style="margin-top:14px" data-action="explain">▤ 解説を見る</button>`):''}</div><div class="review-btns"><button class="judge bad" data-grade="weak">✕ 分からなかった</button><button class="judge good" data-grade="known">✓ 分かった</button></div>`}h+=`</article><div class="quiz-bottom"><span class="subtle">時間制限なし · 自己採点</span><button class="btn ghost" data-action="leave">中断して戻る</button></div></div>`;view.innerHTML=h;scrollTop()}
function grade(status){const s=current();if(!s||s.cursor>=s.queue.length||!ui.reveal)return;const id=s.queue[s.cursor];const prev=state.grades[id]||{status:null,attempts:0,correct:0,wrong:0};state.grades[id]={status,attempts:(prev.attempts||0)+1,correct:(prev.correct||0)+(status==='known'?1:0),wrong:(prev.wrong||0)+(status==='weak'?1:0),lastAnswered:new Date().toISOString()};if(status==='known')s.correct++;else s.wrong++;s.cursor++;ui.reveal=false;ui.showExplanation=false;if(s.cursor>=s.queue.length){s.completed=true;s.finishedAt=new Date().toISOString()}persist();if(s.completed)renderResults();else renderQuiz()}
function renderResults(){const s=current();if(!s){renderStart();return}setScreen('results');const c=counts(ui.scope);const done=s.correct+s.wrong;const score=done?Math.round(100*s.correct/done):0;
 view.innerHTML=`<div class="quiz-shell">${breadcrumbs(ui.scope)}<section class="panel end-card"><div class="end-emoji">${s.wrong===0?'🏆':'🎉'}</div><p class="eyebrow">ROUND COMPLETE</p><h1>${done}問、おつかれ！</h1><p class="lead">今回の正答率は ${score}%</p><div class="result-grid"><div class="result-cell"><strong style="color:var(--green)">${s.correct}</strong><span>今回わかった</span></div><div class="result-cell"><strong style="color:var(--red)">${s.wrong}</strong><span>今回わからなかった</span></div><div class="result-cell"><strong>${c.weak}</strong><span>残りの苦手問題</span></div></div><p class="subtle">この範囲の習得済み：${c.known}問 ／ 未回答：${c.unanswered}問</p><div class="end-actions"><button class="btn primary wide" data-action="review" ${c.weak===0?'disabled':''}>↻ 苦手 ${c.weak}問を復習する</button><button class="btn secondary wide" data-action="repeat">⟳ 全${c.all}問に再挑戦する</button><button class="btn ghost wide" data-tree="${ui.scope}">← 分野一覧に戻る</button></div></section></div>`;scrollTop()}
function renderSettings(){setScreen('settings');const allc={all:ALL.length,known:0,weak:0,unanswered:0};ALL.forEach(q=>{const k=state.grades[q.id]?.status;if(k==='known')allc.known++;else if(k==='weak')allc.weak++;else allc.unanswered++});view.innerHTML=`<div style="max-width:680px;margin:0 auto"><button class="btn ghost" data-tree="home">← ホームに戻る</button><section class="hero"><p class="eyebrow">SETTINGS</p><h1>学習記録と設定</h1><p class="lead">記録はユーザー登録なしで、この端末のブラウザに保存してるで。</p>${statsRow(allc)}</section><section class="panel"><h2>📥 記録のバックアップ</h2><p class="subtle">スマホ変更やブラウザのデータ削除に備えて、記録をファイルに保存できます。</p><div class="review-btns"><button class="btn secondary" data-action="export">バックアップ保存</button><button class="btn secondary" data-action="import">バックアップ読込</button></div><input id="importInput" type="file" accept=".json,application/json" class="hidden" /></section><section class="panel"><h2>📱 ホーム画面に追加</h2><p class="subtle">iPhoneではSafariで公開サイトを開き、共有メニューの「ホーム画面に追加」を選んでください。アプリのように起動できます。</p></section><section class="panel"><h2>ℹ️ 現在のバージョン</h2><p class="subtle">問題データ v${escapeHTML(DATA.version)} ／ ${ALL.length}問。問題を追加しても、同じIDの正誤記録はそのまま残る設計です。</p></section>${volatile?'<div class="notice">保存できない環境の可能性があります。通常のブラウザでお試しください。</div>':''}</div>`;scrollTop()}
function exportBackup(){const payload={type:'studydeck-backup',version:1,createdAt:new Date().toISOString(),data:state};const b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='studydeck-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function importBackup(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const p=JSON.parse(reader.result);if(p.type!=='studydeck-backup'||p.version!==1||!p.data||typeof p.data.grades!=='object'||!p.data.grades)throw Error('not backup');if(!window.confirm('現在の学習記録を、バックアップで置き換えます。よろしいですか？'))return;state={grades:p.data.grades,sessions:p.data.sessions||{}};persist();alert('学習記録を読み込みました。');renderSettings()}catch(err){alert('読み込みに失敗しました。Study DeckのバックアップJSONか確認してください。')}};reader.readAsText(file)}
view.addEventListener('click',ev=>{const btn=ev.target.closest('[data-tree],[data-start],[data-mode],[data-order],[data-action],[data-grade]');if(!btn)return;
 if(btn.dataset.tree){const id=btn.dataset.tree;treeView(id==='home'?null:id);return}
 if(btn.dataset.start){menu(btn.dataset.start);return}
 if(btn.dataset.mode){ui.mode=btn.dataset.mode;renderStart();return}
 if(btn.dataset.order){ui.order=btn.dataset.order;renderStart();return}
 if(btn.dataset.grade){grade(btn.dataset.grade);return}
 const a=btn.dataset.action;
 if(a==='resume')resumed();if(a==='restart'){delete state.sessions[ui.scope];persist();renderStart()}
 if(a==='begin')beginRound();if(a==='reveal'){ui.reveal=true;renderQuiz()}
 if(a==='explain'){ui.showExplanation=true;renderQuiz()}if(a==='leave')menu(ui.scope);
 if(a==='review'){ui.mode='weak';ui.order='registered';beginRound('weak','registered')}
 if(a==='repeat'){ui.mode='all';ui.order='registered';beginRound('all','registered')}
 if(a==='export')exportBackup();if(a==='import')document.getElementById('importInput')?.click();
});
view.addEventListener('change',ev=>{if(ev.target?.id==='importInput')importBackup(ev.target.files?.[0])});
document.getElementById('logo').addEventListener('click',()=>treeView());document.getElementById('settingBtn').addEventListener('click',renderSettings);
treeView();
if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
